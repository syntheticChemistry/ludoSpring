# SPDX-License-Identifier: AGPL-3.0-or-later
#
# ludoSpring workspace — the science of play, interaction, and game design.
#
# Stops Cargo from walking up to the parent ecoPrimals workspace.
# Each sub-crate retains its own [workspace] root so that `cargo test`
# works both from sub-crate directories and from this root via
# `--manifest-path`.

[workspace]
resolver = "2"
members = [
    "barracuda",
    "benchmarks",
    "metalForge/forge",
]

[workspace.package]
edition = "2024"
rust-version = "1.87"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7"] }
proptest = "1"
thiserror = "2"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
doc_markdown = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
